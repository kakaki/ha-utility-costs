name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v' custom_components/utility_costs/manifest.json > m.json
          mv m.json custom_components/utility_costs/manifest.json
      - name: Zip integration
        run: cd custom_components/utility_costs && zip -r ../../utility_costs.zip . -x '__pycache__/*'
      - uses: softprops/action-gh-release@v2
        with:
          files: utility_costs.zip
